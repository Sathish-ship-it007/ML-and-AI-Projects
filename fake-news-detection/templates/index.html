<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📰 Fake News Detector</title>
    <link rel="icon" href="{{ url_for('static', filename='fake-news.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <h2>🔍 Fake News Detection App</h2>
            <p class="subtitle">Detect whether a news article is 🔥 fake or ✅ real in seconds!</p>

            <form method="POST" action="/predict">
                <textarea name="news" rows="8" placeholder="📰 Paste your news content here..." required></textarea>
                <input type="submit" value="🚀 Check News">
            </form>

            {% if prediction_text %}
            <div class="result">
                <h3>🧠 Prediction Result:</h3>
                <p>{{ prediction_text }}</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
