<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>📧 Email Spam Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>📬 Email Spam Classifier</h1>
        <p>⚡ Paste your email below and detect if it's <span class="spam">Spam</span> or <span class="ham">Not Spam</span>.</p>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="✍️ Write or paste your email content here..." required></textarea><br>
            <button type="submit">🔍 Predict</button>
        </form>

        {% if prediction is not none %}
        <div class="result-card">
            <h3>📤 Submitted Message</h3>
            <div class="message">{{ message }}</div>
            <h3>🔎 Prediction Result:</h3>
            <p class="prediction">
                {% if prediction == 1 %}
                    🚨 <span class="spam">Spam</span> Message Detected!
                {% else %}
                    ✅ <span class="ham">Not Spam</span> – You're good to go!
                {% endif %}
            </p>
        </div>
        {% endif %}
    </div>
</body>
</html>
