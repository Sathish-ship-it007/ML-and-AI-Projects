<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏦 Loan Eligibility Predictor</title>
    <link rel="icon" href="{{ url_for('static', filename='loan.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="wrapper">
        <div class="container">
            <h2>🔍 Check Your Loan Eligibility</h2>
            <p class="subtitle">Fast & Simple — No paperwork! 📝</p>

            <form action="/predict" method="post">
                <label for="age">🎂 Age:</label>
                <input type="number" name="age" placeholder="e.g., 28" required>

                <label for="income">💰 Monthly Income (₹):</label>
                <input type="number" name="income" placeholder="e.g., 45000" required>

                <label for="education">🎓 Education Level:</label>
                <select name="education">
                    <option value="Graduate">🎓 Graduate</option>
                    <option value="Not Graduate">📚 Not Graduate</option>
                </select>

                <label for="credit_score">📈 Credit Score:</label>
                <input type="number" name="credit_score" placeholder="e.g., 750" required>

                <button type="submit">🚀 Predict Eligibility</button>
            </form>

            {% if prediction_text %}
            <div class="result">
                <h3>✅ Result:</h3>
                <p>{{ prediction_text }}</p>
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
